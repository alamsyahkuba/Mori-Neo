apply plugin: 'com.android.application'

android {
    namespace = "com.mori.downloader"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = "28.2.13676358"
    defaultConfig {
        applicationId "com.mori.downloader"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "4.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    packagingOptions {
        pickFirst 'lib/**/libmorisec.so'
    }
    if (file('src/main/cpp/CMakeLists.txt').exists()) {
        externalNativeBuild {
            cmake {
                path file('src/main/cpp/CMakeLists.txt')
                version '3.22.1'
            }
        }
    }
    signingConfigs {
        release {
            // CI: ANDROID_KEYSTORE_FILE (temp file decoded from the
            // ANDROID_KEYSTORE_BASE64 secret) plus password/alias secrets are
            // supplied via environment variables — never committed to the repo.
            // Local: falls back to android/app/release.keystore with the
            // documented default credentials (see CONTRIBUTING.md).
            def envKeystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
            def keystoreFile = envKeystorePath ? file(envKeystorePath) : file('release.keystore')
            if (envKeystorePath && !keystoreFile.exists()) {
                throw new GradleException("ANDROID_KEYSTORE_FILE is set but the keystore does not exist: ${envKeystorePath}")
            }
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                if (envKeystorePath) {
                    def storePass = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                    def alias = System.getenv("ANDROID_KEY_ALIAS")
                    def keyPass = System.getenv("ANDROID_KEY_PASSWORD")
                    if (!storePass || !alias || !keyPass) {
                        throw new GradleException("Incomplete signing credentials: ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD must all be set when ANDROID_KEYSTORE_FILE is set")
                    }
                    storePassword storePass
                    keyAlias alias
                    keyPassword keyPass
                } else {
                    storePassword 'android123'
                    keyAlias 'mori'
                    keyPassword 'android123'
                }
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "Mori v${variant.versionName}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
