name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend & backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check workflow YAML syntax
        run: |
          for f in .github/workflows/*.yml; do
            echo "Checking $f"
            npx --yes js-yaml "$f" > /dev/null
          done

      - name: Install frontend dependencies
        run: npm ci

      - name: Bundle check — app.js
        run: npx esbuild public/js/app.js --bundle --outfile=/dev/null --format=esm

      - name: Bundle check — share.js
        run: npx esbuild public/js/share.js --bundle --outfile=/dev/null --format=esm

      - name: Bundle check — style.css
        run: npx esbuild public/css/style.css --bundle --outfile=/dev/null

      - name: Check scraper bundle is present
        run: test -s public/js/scrapers/bundle.js

      - name: Install Linux system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
