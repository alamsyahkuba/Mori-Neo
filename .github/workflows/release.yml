name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify tag matches project versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify version consistency
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "Not a tag build ($GITHUB_REF) — skipping tag/version check."
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          TAURI="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          GRADLE="$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)"
          echo "tag=v$TAG  package.json=$PKG  tauri.conf.json=$TAURI  versionName=$GRADLE"
          for v in "$PKG" "$TAURI" "$GRADLE"; do
            if [[ "$v" != "$TAG" ]]; then
              echo "::error::Version mismatch: tag v$TAG vs $v"
              exit 1
            fi
          done
          echo "All version sources match tag v$TAG."

  build-desktop:
    name: Build ${{ matrix.platform }}
    needs: verify-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
          - platform: "macos-latest"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build Tauri App
        run: npx tauri build

      - name: Prepare & Rename Release Assets (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-assets

          rm -rf /tmp/dmg_build && mkdir -p /tmp/dmg_build
          cp -r "src-tauri/target/release/bundle/macos/Mori.app" /tmp/dmg_build/
          cp "src-tauri/README.txt" /tmp/dmg_build/
          ln -s /Applications /tmp/dmg_build/Applications
          hdiutil create -volname "Mori" -srcfolder /tmp/dmg_build -ov -format UDZO "dist-assets/Mori-v${VERSION}-macOS-arm64.dmg"
          rm -rf /tmp/dmg_build

          tar -czf "dist-assets/Mori-v${VERSION}-macOS-arm64.app.tar.gz" -C src-tauri/target/release/bundle/macos Mori.app

      - name: Prepare & Rename Release Assets (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-assets
          find src-tauri/target/release/bundle/nsis -name "*.exe" -exec cp {} "dist-assets/Mori-v${VERSION}-Windows-x64-Setup.exe" \;
          find src-tauri/target/release/bundle/msi -name "*.msi" -exec cp {} "dist-assets/Mori-v${VERSION}-Windows-x64.msi" \;

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android (signed APK)
    needs: verify-version
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Verify Java version (must be 21)
        shell: bash
        run: |
          java -version
          JAVA_MAJOR="$(java -version 2>&1 | sed -nE 's/.*version "([0-9]+).*/\1/p' | head -1)"
          if [[ "$JAVA_MAJOR" != "21" ]]; then
            echo "::error::Expected Java major version 21, got '${JAVA_MAJOR:-unknown}'"
            exit 1
          fi
          echo "Java major version is 21 — Capacitor 7 requires source release 21."

      - name: Configure Android signing (decode keystore from secrets)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ANDROID_KEY_ALIAS" ] && MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ -z "$ANDROID_KEY_PASSWORD" ] && MISSING="$MISSING ANDROID_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing Android signing secrets:$MISSING (see CONTRIBUTING.md → Building for Android → CI Signing Secrets)"
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/mori-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a non-empty keystore file"
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Decoded keystore failed keytool validation (wrong password or corrupt keystore)"
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi
          echo "Release keystore decoded to a temporary file and validated."
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature and alignment (apksigner + zipalign)
        shell: bash
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No APK found after gradle build"
            exit 1
          fi
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$BUILD_TOOLS" ]; then
            echo "::error::No Android build-tools found under ANDROID_HOME=${ANDROID_HOME:-<unset>}"
            exit 1
          fi
          echo "Verifying with build-tools $(basename "$BUILD_TOOLS"): $APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          echo "APK signature and zip alignment verified."

      - name: Prepare Release Asset (Android)
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-assets
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No APK found after gradle build"
            exit 1
          fi
          cp "$APK" "dist-assets/Mori-v${VERSION}-android.apk"
          ls -la dist-assets/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mori-Android-APK
          path: dist-assets/*.apk

      - name: Upload Release Asset (Android)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: |
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ] && [ -f "$ANDROID_KEYSTORE_FILE" ]; then
            rm -f "$ANDROID_KEYSTORE_FILE"
            echo "Temporary keystore removed."
          else
            echo "No temporary keystore to remove."
          fi
