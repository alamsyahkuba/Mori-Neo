name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify tag matches project versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify version consistency
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "Not a tag build ($GITHUB_REF) — skipping tag/version check."
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          TAURI="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          GRADLE="$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)"
          echo "tag=v$TAG  package.json=$PKG  tauri.conf.json=$TAURI  versionName=$GRADLE"
          for v in "$PKG" "$TAURI" "$GRADLE"; do
            if [[ "$v" != "$TAG" ]]; then
              echo "::error::Version mismatch: tag v$TAG vs $v"
              exit 1
            fi
          done
          echo "All version sources match tag v$TAG."

  build-desktop:
    name: Build ${{ matrix.platform }}
    needs: verify-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
          - platform: "macos-latest"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build Tauri App
        run: npx tauri build

      - name: Prepare & Rename Release Assets (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-assets

          rm -rf /tmp/dmg_build && mkdir -p /tmp/dmg_build
          cp -r "src-tauri/target/release/bundle/macos/Mori.app" /tmp/dmg_build/
          cp "src-tauri/README.txt" /tmp/dmg_build/
          ln -s /Applications /tmp/dmg_build/Applications
          hdiutil create -volname "Mori" -srcfolder /tmp/dmg_build -ov -format UDZO "dist-assets/Mori-v${VERSION}-macOS-arm64.dmg"
          rm -rf /tmp/dmg_build

          tar -czf "dist-assets/Mori-v${VERSION}-macOS-arm64.app.tar.gz" -C src-tauri/target/release/bundle/macos Mori.app

      - name: Prepare & Rename Release Assets (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-assets
          find src-tauri/target/release/bundle/nsis -name "*.exe" -exec cp {} "dist-assets/Mori-v${VERSION}-Windows-x64-Setup.exe" \;
          find src-tauri/target/release/bundle/msi -name "*.msi" -exec cp {} "dist-assets/Mori-v${VERSION}-Windows-x64.msi" \;

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android (unsigned APK)
    needs: verify-version
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build unsigned release APK
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Asset (Android)
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-assets
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No APK found after gradle build"
            exit 1
          fi
          cp "$APK" "dist-assets/Mori-v${VERSION}-android-unsigned.apk"
          ls -la dist-assets/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mori-Android-Unsigned-APK
          path: dist-assets/*.apk

      - name: Upload Release Asset (Android)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
